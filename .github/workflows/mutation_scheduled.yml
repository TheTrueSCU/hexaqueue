name: Scheduled Mutation Testing Audit

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-mutations:
    name: Plan Workspace Mutation Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_affected: ${{ steps.plan.outputs.has_affected }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Plan LPT-Ordered Package Matrix
        id: plan
        uses: TheTrueSCU/hexaqual/.github/actions/mutate-plan@6117ce25b1d39768f22396a55d13103abee88926 # v0.12.1
        with:
          mode: all

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/mutation_scheduled.yml --summary --critical-path

  mutation-audit:
    name: Mutation Audit (${{ matrix.package }})
    needs: plan-mutations
    if: needs.plan-mutations.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-mutations.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        uses: ./
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          auto-tunnel: "true"
          step-summary: "false"

      - name: Execute Package Mutation Sweep
        env:
          HEXAQUEUE_TIMEOUT: "6900"
          HEXAQUEUE_RUN_ID_FILE: ${{ runner.temp }}/hexaqueue-active-run.id
        run: uv run hexaqual mutate run -p "${{ matrix.package }}" -e gremlins -w auto --batch-size 10 -n auto --cluster hexaqueue

      - name: Cancel Orphaned Hexaqueue Mutation Run (On Failure/Cancel)
        if: cancelled() || failure()
        run: python3 .github/scripts/cancel_orphaned_workload.py --kind run --id-file "${{ runner.temp }}/hexaqueue-active-run.id"

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always()
        run: uv run hq cluster tunnel --stop || true

      - name: Generate Mutation Triage Summary
        if: always()
        run: |
          uv run hexaqual mutate inspect -p "${{ matrix.package }}" -s -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Mutation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: mutation-audit-report-${{ matrix.package }}
          path: |
            .gremlins-cache/
            .mutmut-cache
          if-no-files-found: ignore
          retention-days: 14
