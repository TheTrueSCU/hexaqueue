name: Scheduled Mutation Testing Audit

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-audit:
    name: Full Workspace Mutation Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/mutation_scheduled.yml --summary --critical-path

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Cluster Reachability & Health Probe
        id: cluster-probe
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.HEXAQUEUE_CLUSTER_HOST }}" ] || [ -z "${{ secrets.HEXAQUEUE_SSH_KEY }}" ]; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=healthy" >> "$GITHUB_OUTPUT"

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: steps.cluster-probe.outputs.status == 'healthy'
        uses: TheTrueSCU/hexaqueue@v0.9.0
        with:
          host: ${{ secrets.HEXAQUEUE_CLUSTER_HOST }}
          ssh-key: ${{ secrets.HEXAQUEUE_SSH_KEY }}
          user: ${{ secrets.HEXAQUEUE_SSH_USER }}
          port: 8000
          version: ">=0.9.0"

      - name: Execute Full Workspace Mutation Sweep
        run: |
          CLUSTER_FLAGS=""
          if [ "${{ steps.cluster-probe.outputs.status }}" = "healthy" ]; then
            CLUSTER_FLAGS="--cluster hexaqueue --cluster-url http://127.0.0.1:8000"
          fi
          uv run hexaqual mutate run -a -e gremlins -w auto --batch-size 10 -n auto $CLUSTER_FLAGS

      - name: Generate Mutation Triage Summary
        if: always()
        run: |
          uv run hexaqual mutate inspect -s -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Mutation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: mutation-audit-report
          path: |
            .gremlins-cache/
            .mutmut-cache
          retention-days: 14
