name: Coverage-Guided & Security Fuzzing

on:
  schedule:
    - cron: "0 2 * * 0"  # 02:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of fuzzing runs per harness"
        required: false
        default: "5000"
        type: string

permissions: read-all

jobs:
  fuzz:
    name: Atheris & OWASP Security Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/fuzz.yml --summary --critical-path

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies & Atheris
        run: |
          uv sync --all-packages --all-extras --all-groups
          uv pip install atheris

      - name: Cluster Reachability & Health Probe
        id: cluster-probe
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.HEXAQUEUE_CLUSTER_HOST }}" ] || [ -z "${{ secrets.HEXAQUEUE_SSH_KEY }}" ]; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=healthy" >> "$GITHUB_OUTPUT"

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: steps.cluster-probe.outputs.status == 'healthy'
        uses: TheTrueSCU/hexaqueue@v0.9.0
        with:
          host: ${{ secrets.HEXAQUEUE_CLUSTER_HOST }}
          ssh-key: ${{ secrets.HEXAQUEUE_SSH_KEY }}
          user: ${{ secrets.HEXAQUEUE_SSH_USER }}
          port: 8000
          version: ">=0.9.0"

      - name: Execute Coverage-Guided & OWASP Fuzzing
        run: |
          RUNS="${{ github.event.inputs.runs || '5000' }}"
          uv run hexaqual test fuzz --target all --runs "$RUNS" --engine auto || true

      - name: Execute Full Property-Based State Machine Fuzzing
        run: |
          CLUSTER_FLAGS=""
          if [ "${{ steps.cluster-probe.outputs.status }}" = "healthy" ]; then
            CLUSTER_FLAGS="--cluster hexaqueue --cluster-url http://127.0.0.1:8000"
          fi
          uv run hexaqual test run -P --no-cov --allow-empty $CLUSTER_FLAGS
