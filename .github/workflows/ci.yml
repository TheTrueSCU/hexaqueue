name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  # =========================================================================
  # Stage 1: Fast Quality Gate & Schema Governance (Fail-Fast Static Checks)
  # =========================================================================
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/ci.yml --summary --critical-path

      - name: Install Copy-Paste Detection
        run: cargo install jscpd --locked

      - name: Run Quality Gate via Hexaqual
        uses: TheTrueSCU/hexaqual@b2c312f76c0c447b359b99b96ea02d82116ae287 # v0.10.0
        with:
          sync-args: "--all-packages --all-extras --all-groups"

      - name: Audit Repository Quality Gates
        run: uv run hexaqual sanity --audit-gates

      - name: Verify Documentation Consistency (Anti-Drift Linter)
        run: uv run hexaqual docs drift

  # =========================================================================
  # Stage 1b: Cluster Health & Discovery Probe (Fast Parallel Cloud Check)
  # Discovers and probes multi-provider fleet using unified .env secret & CLI
  # =========================================================================
  cluster-probe:
    name: Cluster Reachability & Health Probe
    runs-on: ubuntu-latest
    outputs:
      cluster_ready: ${{ steps.probe.outputs.cluster_ready }}
      cluster_host: ${{ steps.probe.outputs.cluster_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Hexaqueue CLI
        run: uv sync --package hexaqueue_cli --package hexaqueue_core

      - name: Hydrate Cluster Environment (.env)
        env:
          DOTENV_PAYLOAD: ${{ secrets.HEXAQUEUE_ENV }}
        run: |
          if [ -n "$DOTENV_PAYLOAD" ]; then
            echo "$DOTENV_PAYLOAD" > .env
            chmod 600 .env
            if grep -q "HEXAQUEUE_SSH_KEY_B64=" .env; then
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              grep "HEXAQUEUE_SSH_KEY_B64=" .env | cut -d '=' -f2- | tr -d '"' | base64 -d > ~/.ssh/hexaqueue_ci_id
              chmod 600 ~/.ssh/hexaqueue_ci_id
              echo "HEXAQUEUE_SSH_KEY=$HOME/.ssh/hexaqueue_ci_id" >> .env
              echo "HEXAQUEUE_SSH_KEY=$HOME/.ssh/hexaqueue_ci_id" >> "$GITHUB_ENV"
            fi
          fi

      - name: Discover and Probe Cluster Nodes via Hexaqueue CLI
        id: probe
        env:
          NO_COLOR: "1"
        run: |
          DISCOVERY=$(uv run hq cluster discover --format json 2>/dev/null || echo "[]")
          echo "Discovered fleet topology: $DISCOVERY"

          SELECTED_HOST=$(echo "$DISCOVERY" | python3 -c "
          import sys, json, re
          try:
              raw = sys.stdin.read()
              clean = re.sub(r'\x1b\[[0-9;]*m', '', raw).strip()
              candidates = json.loads(clean, strict=False)
              ready = [c for c in candidates if c.get('status') in ('ONLINE', 'SSH_AVAILABLE')]
              if ready:
                  print(ready[0]['host'])
          except Exception as exc:
              print(f'JSON parse error: {exc}', file=sys.stderr)
          ")

          if [ -n "$SELECTED_HOST" ]; then
            echo "Verifying SSH tunnel connectivity to $SELECTED_HOST..."
            if uv run hq cluster tunnel --host "$SELECTED_HOST"; then
              echo "Cluster connectivity verified."
              uv run hq cluster tunnel --stop || true
              echo "cluster_ready=true" >> "$GITHUB_OUTPUT"
              echo "cluster_host=$SELECTED_HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "No reachable cloud cluster nodes available; falling back to local runner."
          echo "cluster_ready=false" >> "$GITHUB_OUTPUT"
          echo "cluster_host=" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # Stage 2: Unit & Integration Tests & Architecture Verification
  # Executes if Stage 1 static quality checks succeed.
  # Dynamically offloads to Hexaqueue Cloud or falls back to local xdist.
  # =========================================================================
  test-suite:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    needs: [quality-gate, cluster-probe]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Hydrate Cluster Environment (.env)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        env:
          DOTENV_PAYLOAD: ${{ secrets.HEXAQUEUE_ENV }}
        run: |
          if [ -n "$DOTENV_PAYLOAD" ]; then
            echo "$DOTENV_PAYLOAD" > .env
            chmod 600 .env
            if grep -q "HEXAQUEUE_SSH_KEY_B64=" .env; then
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              grep "HEXAQUEUE_SSH_KEY_B64=" .env | cut -d '=' -f2- | tr -d '"' | base64 -d > ~/.ssh/hexaqueue_ci_id
              chmod 600 ~/.ssh/hexaqueue_ci_id
              echo "HEXAQUEUE_SSH_KEY=$HOME/.ssh/hexaqueue_ci_id" >> .env
              echo "HEXAQUEUE_SSH_KEY=$HOME/.ssh/hexaqueue_ci_id" >> "$GITHUB_ENV"
            fi
          fi

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        run: |
          KEY_ARG=""
          if [ -f "$HOME/.ssh/hexaqueue_ci_id" ]; then
            KEY_ARG="--key $HOME/.ssh/hexaqueue_ci_id"
          fi
          uv run hq cluster tunnel --host "${{ needs.cluster-probe.outputs.cluster_host }}" $KEY_ARG

      - name: Run Tests via Hexaqueue Cloud (Push to Main)
        if: needs.cluster-probe.outputs.cluster_ready == 'true' && github.event_name == 'push'
        run: uv run hexaqual test run -U --profile ci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Tests via Hexaqueue Cloud (Pull Request)
        if: needs.cluster-probe.outputs.cluster_ready == 'true' && github.event_name == 'pull_request'
        run: uv run hexaqual test run -A -U --profile ci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Tests Locally via xdist (Push to Main - Local Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true' && github.event_name == 'push'
        run: uv run hexaqual test run -U --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Tests Locally via xdist (Pull Request - Local Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true' && github.event_name == 'pull_request'
        run: uv run hexaqual test run -A -U --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: junit.xml

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: uv run hq cluster tunnel --stop || true

  architecture-diagrams:
    name: Architecture Diagram Verification
    needs: [quality-gate]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Check pydeps diagrams are up to date
        run: |
          uv run hexaqual deps pydeps
          git diff --exit-code docs/assets/pydeps/ || \
            (echo "::error::Architecture diagrams are stale. Run 'pydeps-generate' locally and commit the updated SVGs." && exit 1)

  # =========================================================================
  # Stage 3: Invariant & Security Fuzzing (Deep Verification)
  # Only executes on PRs if Unit & Integration test suite passed cleanly
  # =========================================================================
  hypothesis-fuzzing:
    name: Property-Based State Machine Fuzzing
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Affected Property-Based Fuzzing
        run: uv run hexaqual test run -A -P --no-cov --allow-empty

  # =========================================================================
  # Stage 4: Mutation Testing Verification (PR Quality Fortification)
  # Runs pytest-gremlins mutation testing on affected packages
  # =========================================================================
  mutation-verification:
    name: Mutation Testing Verification
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Affected Mutation Testing Verification
        run: uv run hexaqual mutate run -A -e gremlins -w auto --batch-size 10 -n auto

  # =========================================================================
  # Stage 5: Unified CI Success Status Check (Branch Protection Gate)
  # Aggregates results of all upstream stages, handling skipped conditional jobs
  # =========================================================================
  ci-success:
    name: CI Success (All Required Checks)
    needs:
      - quality-gate
      - cluster-probe
      - test-suite
      - architecture-diagrams
      - hypothesis-fuzzing
      - mutation-verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: always()
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: always()
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: always()
        run: uv sync --all-packages --all-extras --all-groups

      - name: Generate CI Duration Breakdown & Trend Chart
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run hexaqual gh ci-duration --workflow CI --branch main --summary --pr "${{ github.event.pull_request.number }}" || true

      - name: Verify All Upstream Jobs Succeeded or Skipped
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Pre-Commit Quality Gate:      ${{ needs.quality-gate.result }}"
          echo "  Cluster Discovery Probe:      ${{ needs.cluster-probe.result }}"
          echo "  Unit & Integration Tests:     ${{ needs.test-suite.result }}"
          echo "  Architecture Diagrams:        ${{ needs.architecture-diagrams.result }}"
          echo "  Property-Based Fuzzing:       ${{ needs.hypothesis-fuzzing.result }}"
          echo "  Mutation Verification:        ${{ needs.mutation-verification.result }}"

          results=(
            "${{ needs.quality-gate.result }}"
            "${{ needs.cluster-probe.result }}"
            "${{ needs.test-suite.result }}"
            "${{ needs.architecture-diagrams.result }}"
            "${{ needs.hypothesis-fuzzing.result }}"
            "${{ needs.mutation-verification.result }}"
          )

          for res in "${results[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more upstream CI jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "🎉 All required CI jobs completed successfully (or were cleanly skipped)."
