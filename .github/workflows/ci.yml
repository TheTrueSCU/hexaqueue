name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # =========================================================================
  # Stage 1: Fast Quality Gate & Schema Governance (Fail-Fast Static Checks)
  # =========================================================================
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/ci.yml --summary --critical-path

      - name: Install Copy-Paste Detection
        run: cargo install jscpd --locked

      - name: Run Quality Gate via Hexaqual
        uses: TheTrueSCU/hexaqual@7981788eea94e3a37cb5e24d4d30a07b1bc0bab4 # v0.13.0
        with:
          sync-args: "--all-packages --all-extras --all-groups"

      - name: Audit Repository Quality Gates
        run: uv run hexaqual sanity --audit-gates

      - name: Verify Documentation Consistency (Anti-Drift Linter)
        run: uv run hexaqual docs drift

  # =========================================================================
  # Stage 1b: Cluster Health & Discovery Probe (Fast Parallel Cloud Check)
  # Discovers and probes multi-provider fleet using unified .env secret & CLI
  # =========================================================================
  cluster-probe:
    name: Cluster Reachability & Health Probe
    runs-on: ubuntu-latest
    outputs:
      cluster_ready: ${{ steps.probe.outputs.cluster_ready }}
      cluster_host: ${{ steps.probe.outputs.cluster_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Probe Hexaqueue Cloud Fleet
        id: probe
        uses: ./
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          probe-only: "true"
          step-summary: "true"

  # =========================================================================
  # Stage 2: Unit & Integration Tests & Architecture Verification
  # Executes if Stage 1 static quality checks succeed.
  # Dynamically offloads to Hexaqueue Cloud or falls back to local xdist.
  # =========================================================================
  test-suite:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    needs: [quality-gate, cluster-probe]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        uses: ./
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          auto-tunnel: "true"
          step-summary: "false"

      - name: Run Tests via Hexaqueue Cloud (Push to Main / Manual Dispatch)
        if: needs.cluster-probe.outputs.cluster_ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          HEXAQUEUE_SESSION_ID_FILE: ${{ runner.temp }}/hexaqueue-active-session.id
        run: uv run hexaqual test run -U --cov=packages --cov-fail-under=0 --profile ci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Tests via Hexaqueue Cloud (Pull Request)
        if: needs.cluster-probe.outputs.cluster_ready == 'true' && github.event_name == 'pull_request'
        env:
          HEXAQUEUE_SESSION_ID_FILE: ${{ runner.temp }}/hexaqueue-active-session.id
        run: uv run hexaqual test run -A -U --cov=packages --cov-fail-under=0 --profile ci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Tests Locally via xdist (Push to Main / Manual Dispatch - Local Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: uv run hexaqual test run -U --cov=packages --cov-fail-under=0 --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run Affected Tests Locally via xdist (Pull Request - Local Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true' && github.event_name == 'pull_request'
        run: uv run hexaqual test run -A -U --cov=packages --cov-fail-under=0 --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

      - name: Generate Test Execution Summary
        if: always() && hashFiles('junit.xml') != ''
        env:
          CLUSTER_READY: ${{ needs.cluster-probe.outputs.cluster_ready }}
          CLUSTER_HOST: ${{ needs.cluster-probe.outputs.cluster_host }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: python3 .github/scripts/emit_test_summary.py

      - name: Cancel Orphaned Hexaqueue Test Session (On Failure/Cancel)
        if: (cancelled() || failure()) && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: python3 .github/scripts/cancel_orphaned_workload.py --kind test-session --id-file "${{ runner.temp }}/hexaqueue-active-session.id"

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: uv run hq cluster tunnel --stop || true

  architecture-diagrams:
    name: Architecture Diagram Verification
    needs: [quality-gate]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Check pydeps diagrams are up to date
        run: |
          uv run hexaqual deps pydeps
          SEMANTIC_DIFF=$(git diff docs/assets/pydeps/ | grep -E '^[+-]\s*<title>' || true)
          if [ -n "$SEMANTIC_DIFF" ]; then
            echo "::error::Architecture dependencies have changed without updating diagrams. Run 'hexaqual deps pydeps' locally and commit the updated SVGs."
            echo "$SEMANTIC_DIFF"
            exit 1
          fi
          echo "Architecture dependency diagrams verified (no structural changes)."

      - name: Check topology diagrams are up to date
        run: |
          uv run python scripts/docs/generate_topologies.py
          echo "Topology diagrams generated successfully."

  # =========================================================================
  # Stage 3: Invariant & Security Fuzzing (Deep Verification)
  # Only executes on PRs if Unit & Integration test suite passed cleanly
  # =========================================================================
  hypothesis-fuzzing:
    name: Property-Based State Machine Fuzzing
    needs: [test-suite, cluster-probe]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        uses: ./
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          auto-tunnel: "true"
          step-summary: "false"

      - name: Run Affected Property-Based Fuzzing
        run: |
          CLUSTER_FLAGS=""
          if [ "${{ needs.cluster-probe.outputs.cluster_ready }}" = "true" ]; then
            CLUSTER_FLAGS="-- --hexaqueue --hq-server http://127.0.0.1:8000"
          fi
          uv run hexaqual test run -A -P --no-cov --allow-empty $CLUSTER_FLAGS

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: uv run hq cluster tunnel --stop || true

  # =========================================================================
  # Stage 4: Mutation Testing Verification (PR Quality Fortification)
  # Discovers directly affected packages in LPT order and runs them in parallel
  # =========================================================================
  mutation-plan:
    name: Mutation Testing Plan
    needs: [test-suite]
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_affected: ${{ steps.plan.outputs.has_affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Plan AST-Weighted Changed Mutation Slices
        id: plan
        uses: TheTrueSCU/hexaqual/.github/actions/mutate-plan@7981788eea94e3a37cb5e24d4d30a07b1bc0bab4 # v0.13.0
        with:
          mode: changed-slices
          base-ref: ${{ github.base_ref }}
          slices: "8"
          max-weight: "450"

  mutation-verification:
    name: Mutation Testing Verification (${{ matrix.name }})
    needs: [test-suite, cluster-probe, mutation-plan]
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/') && needs.mutation-plan.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        uses: ./
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          auto-tunnel: "true"
          step-summary: "false"

      - name: Run Package Mutation Testing via Hexaqueue Cloud
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        env:
          HEXAQUEUE_TIMEOUT: "3300"
          HEXAQUEUE_RUN_ID_FILE: ${{ runner.temp }}/hexaqueue-active-run.id
        run: uv run hexaqual mutate run -p "${{ matrix.package }}" --targets "${{ matrix.targets }}" -e gremlins -w auto --batch-size 10 -n auto --cluster hexaqueue

      - name: Run Package Mutation Testing Locally (Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true'
        run: uv run hexaqual mutate run -p "${{ matrix.package }}" --targets "${{ matrix.targets }}" -e gremlins -w auto --batch-size 10 -n auto

      - name: Cancel Orphaned Hexaqueue Mutation Run (On Failure/Cancel)
        if: (cancelled() || failure()) && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: python3 .github/scripts/cancel_orphaned_workload.py --kind run --id-file "${{ runner.temp }}/hexaqueue-active-run.id"

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: uv run hq cluster tunnel --stop || true

  # =========================================================================
  # Stage 4: E2E Browser & Visual Accessibility (axe-core) Verification
  # Runs Playwright Chromium tests and UI accessibility scans
  # =========================================================================
  e2e-a11y:
    name: E2E Browser & A11y Verification
    needs: [test-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Run E2E & Visual A11y Tests
        run: uv run pytest tests/e2e --no-cov

  # =========================================================================
  # Stage 5: Unified CI Success Status Check (Branch Protection Gate)
  # Aggregates results of all upstream stages, handling skipped conditional jobs
  # =========================================================================
  ci-success:
    name: CI Success (All Required Checks)
    needs:
      - quality-gate
      - cluster-probe
      - test-suite
      - architecture-diagrams
      - hypothesis-fuzzing
      - e2e-a11y
      - mutation-verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: always()
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: always()
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: always()
        run: uv sync --all-packages --all-extras --all-groups

      - name: Generate CI Duration Breakdown & Trend Chart
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run hexaqual gh ci-duration --workflow CI --branch main --summary --pr "${{ github.event.pull_request.number }}" || true

      - name: Verify All Upstream Jobs Succeeded or Skipped
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Pre-Commit Quality Gate:      ${{ needs.quality-gate.result }}"
          echo "  Cluster Discovery Probe:      ${{ needs.cluster-probe.result }}"
          echo "  Unit & Integration Tests:     ${{ needs.test-suite.result }}"
          echo "  Architecture Diagrams:        ${{ needs.architecture-diagrams.result }}"
          echo "  Property-Based Fuzzing:       ${{ needs.hypothesis-fuzzing.result }}"
          echo "  E2E Browser & A11y:           ${{ needs.e2e-a11y.result }}"
          echo "  Mutation Verification:        ${{ needs.mutation-verification.result }}"

          results=(
            "${{ needs.quality-gate.result }}"
            "${{ needs.cluster-probe.result }}"
            "${{ needs.test-suite.result }}"
            "${{ needs.architecture-diagrams.result }}"
            "${{ needs.hypothesis-fuzzing.result }}"
            "${{ needs.e2e-a11y.result }}"
            "${{ needs.mutation-verification.result }}"
          )

          for res in "${results[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more upstream CI jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "🎉 All required CI jobs completed successfully (or were cleanly skipped)."
