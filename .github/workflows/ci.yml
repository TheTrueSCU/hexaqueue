name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  check:
    name: Pre-Commit Quality Gate & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Pre-Commit Quality Checks
        run: uv run pre-commit run --all-files

      - name: Run Unit & Integration Tests
        run: uv run pytest tests/unit tests/integration --cov=packages --cov-report=xml --junitxml=junit.xml

  hypothesis:
    name: Property-Based Fuzzing
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Hypothesis Fuzzing
        run: uv run pytest tests/hypothesis --no-cov
