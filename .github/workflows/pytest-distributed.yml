name: "Distributed Test Execution (pytest-hexaqueue)"

on:
  workflow_dispatch:
    inputs:
      slices:
        description: "Number of parallel test slices"
        required: false
        default: "4"
        type: string
      free_tier:
        description: "Enforce zero-cost multi-CSP free-tier mesh"
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - "packages/pytest_hexaqueue/**"
      - ".github/workflows/pytest-distributed.yml"

permissions:
  contents: read
  id-token: write  # Enables OIDC Workload Identity Federation (WIF)

jobs:
  distributed-test-run:
    name: Pytest Hexaqueue Distributed Slicing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      # Reference Keyless OIDC WIF Step (zero long-lived secrets):
      # - name: Authenticate to Cloud via OIDC
      #   if: env.HEXAQUEUE_AWS_ROLE_ARN != ''
      #   uses: aws-actions/configure-aws-credentials@e3ddf14a3dc1500a1b44ca7544ffbeacb833f2d0 # v4.0.2
      #   with:
      #     role-to-assume: ${{ secrets.HEXAQUEUE_AWS_ROLE_ARN }}
      #     aws-region: us-east-1

      - name: Start Hexaqueue Controller Daemon (Local CI Runner)
        if: ${{ vars.HEXAQUEUE_SERVER_URL == '' || vars.HEXAQUEUE_SERVER_URL == 'http://127.0.0.1:8000' }}
        run: |
          uv run hq server start -p 8000 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Hexaqueue controller daemon healthy on port 8000"
              break
            fi
            sleep 1
          done

      - name: Execute Distributed Tests via Hexaqual
        env:
          HEXAQUEUE_SERVER_URL: ${{ vars.HEXAQUEUE_SERVER_URL || 'http://127.0.0.1:8000' }}
          HEXAQUEUE_API_TOKEN: ${{ secrets.HEXAQUEUE_API_TOKEN }}
        run: |
          uv run hexaqual test run -p pytest-hexaqueue --profile ci
