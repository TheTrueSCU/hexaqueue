# Dependabot configuration for the Hexaqueue monorepo.
#
# Notes:
#   - uv ecosystem manages uv.lock for root workspace and standalone example projects.
#   - Dependencies are grouped to reduce PR noise.
#   - GitHub Actions updates are separate from Python dependency updates.

version: 2

updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: UTC
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, github-actions]

  # ── Python: Workspace Root (uv) ─────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      workspace-deps:
        patterns: ["*"]
    labels: [dependencies, python, uv]

  # ── Python: Examples (uv) ───────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /examples/monte-carlo
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      monte-carlo-deps:
        patterns: ["*"]
    labels: [dependencies, python, example-monte-carlo]
