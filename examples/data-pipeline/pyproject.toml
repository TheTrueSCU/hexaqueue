[project]
name = "data-pipeline"
version = "0.1.0"
description = "Hexaqueue Batch Data Processing & Scientific Workflow Tutorial"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hexaqueue",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.coverage.run]
source = ["src/"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
addopts = "-n auto --import-mode=importlib --cov=src --cov-fail-under=90 --cov-report=term-missing"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["D100", "D104", "D107", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ARG", "D", "E501", "S101", "S105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
hexaqueue = { path = "../../packages/hexaqueue", editable = true }
