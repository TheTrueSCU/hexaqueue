run:
  id: monte-carlo-stochastic-sim
  name: Multi-Regime Monte-Carlo Simulation & Surface Smoothing
  tags:
  - simulation
  - monte-carlo
  - smoothing
  env:
    SIM_DIR: /tmp/mc_sim
  resources:
    cpus: 1
    ram_mb: 512
    scratch_mb: 100
    walltime_seconds: 15
groups:
- id: sim-regimes
  name: Stochastic Trajectory Simulation Regimes
  params:
  - regime: low_vol
    seed: 101
    drift: 0.03
    vol: 0.08
    label: Low Volatility
  - regime: mid_vol
    seed: 202
    drift: 0.05
    vol: 0.18
    label: Medium Volatility
  - regime: high_vol
    seed: 303
    drift: 0.08
    vol: 0.35
    label: High Volatility & Stress
  jobs:
  - id: sim-regime-{{ regime }}
    name: Simulate {{ label }} Trajectories
    command: 'python -c "import json, os, random, math; os.makedirs(''{{ SIM_DIR }}'',
      exist_ok=True); rng = random.Random({{ seed }}); paths = [[100.0] for _ in range(50)];
      [p.append(p[-1] * math.exp(({{ drift }} - 0.5*{{ vol }}**2)*0.01 + {{ vol }}*math.sqrt(0.01)*rng.gauss(0,1)))
      for p in paths for _ in range(99)]; json.dump({''regime'': ''{{ regime }}'',
      ''paths'': paths}, open(''{{ SIM_DIR }}/{{ regime }}.json'', ''w'')); print(''{{
      label }} simulated: 50 paths, 100 steps'')"'
jobs:
- id: smooth-and-aggregate
  name: Multi-Variable Smoothing & Statistical Aggregation
  command: 'python -c "import json; low = json.load(open(''{{ SIM_DIR }}/low_vol.json''))[''paths''];
    mid = json.load(open(''{{ SIM_DIR }}/mid_vol.json''))[''paths'']; high = json.load(open(''{{
    SIM_DIR }}/high_vol.json''))[''paths'']; all_paths = low + mid + high; steps =
    len(all_paths[0]); mean_traj = [sum(p[s] for p in all_paths)/len(all_paths) for
    s in range(steps)]; smoothed = [sum(mean_traj[max(0, i-2):min(steps, i+3)])/len(mean_traj[max(0,
    i-2):min(steps, i+3)]) for i in range(steps)]; term = [p[-1] for p in all_paths];
    print(f''Monte-Carlo Aggregation Complete! Total Paths: {len(all_paths)}, Terminal
    Mean: {sum(term)/len(term):.2f}, Smoothed T=100: {smoothed[-1]:.2f}'')"'
  depends_on:
  - sim-regimes
