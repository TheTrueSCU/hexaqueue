[project]
name = "hexaqueue-core"
version = "0.1.0"
description = "Hexaqueue Core - Pure domain models, scheduling algorithms, and port interfaces"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexastack-core>=0.3.0",
    "hexastack-cqrs>=0.3.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
