[project]
name = "hexaqueue-dashboard"
version = "0.12.0"
description = "Hexaqueue Dashboard - Modern web interface, cluster visualizer, and operator console"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diagrams>=0.24.0",
    "hexaqueue-collateral",
    "hexaqueue-core",
    "hexaqueue-server",
    "hexaqueue-worker",
    "hexastack-auth>=0.11.0",
    "hexastack-core>=0.11.0",
    "hexastack-cqrs>=0.11.0",
    "hexastack-fastapi>=0.11.0",
    "hexastack-grpc>=0.11.0",
    "hexastack-ui[nicegui]>=0.11.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexaqueue-collateral = { workspace = true }
hexaqueue-core = { workspace = true }
hexaqueue-server = { workspace = true }
hexaqueue-worker = { workspace = true }
