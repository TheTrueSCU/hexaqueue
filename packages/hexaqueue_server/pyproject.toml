[project]
name = "hexaqueue-server"
version = "0.5.0"
description = "Hexaqueue Server - High-Availability Central Controller and Scheduler Engine"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hexaqueue-collateral",
    "hexaqueue-core",
    "hexaqueue-monitor",
    "hexastack-auth>=0.11.0",
    "hexastack-core>=0.11.0",
    "hexastack-cqrs>=0.11.0",
    "hexastack-db>=0.11.0",
    "hexastack-events>=0.11.0",
    "hexastack-fastapi>=0.11.0",
    "hexastack-grpc>=0.11.0",
    "hexastack-otel>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexaqueue-collateral = { workspace = true }
hexaqueue-core = { workspace = true }
hexaqueue-monitor = { workspace = true }
