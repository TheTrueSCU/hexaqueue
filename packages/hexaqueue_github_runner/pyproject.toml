[project]
name = "hexaqueue-github-runner"
version = "0.5.0"
description = "Hexaqueue GitHub Runner - Dynamic Self-Hosted GitHub Actions Autoscaler"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "hexaqueue-core",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexaqueue-core = { workspace = true }
