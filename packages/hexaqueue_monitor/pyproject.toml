[project]
name = "hexaqueue-monitor"
version = "0.0.0"
description = "Hexaqueue Monitor - Cluster health, worker/server heartbeat telemetry, and budget tracking daemon"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexaqueue-core",
    "hexastack-core>=0.3.0",
    "hexastack-events>=0.3.0",
    "hexastack-otel>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hexaqueue-core = { workspace = true }
