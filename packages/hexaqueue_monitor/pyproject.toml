[project]
name = "hexaqueue-monitor"
version = "0.5.0"
description = "Hexaqueue Monitor - Cluster health, worker/server heartbeat telemetry, and budget tracking daemon"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hexaqueue-core",
    "hexastack-core>=0.10.1",
    "hexastack-events>=0.10.1",
    "hexastack-otel>=0.10.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexaqueue-core = { workspace = true }
