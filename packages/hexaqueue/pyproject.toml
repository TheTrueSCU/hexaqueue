[project]
name = "hexaqueue"
version = "0.12.2"
description = "Hexaqueue - Cloud-Agnostic HPC Batch Scheduler and Distributed Job Orchestrator"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hexaqueue-cli>=0.12.2",
    "hexaqueue-collateral>=0.12.2",
    "hexaqueue-core>=0.12.2",
    "hexaqueue-dashboard>=0.12.2",
    "hexaqueue-github-runner>=0.12.2",
    "hexaqueue-gitlab-runner>=0.12.2",
    "hexaqueue-kueue>=0.12.2",
    "hexaqueue-monitor>=0.12.2",
    "hexaqueue-scanner>=0.12.2",
    "hexaqueue-server>=0.12.2",
    "hexaqueue-worker>=0.12.2",
    "hexaqueue-workflow>=0.12.2",
    "pytest-hexaqueue>=0.12.2",
]

[project.scripts]
hq = "hexaqueue_cli.main:app"
hexaqueue = "hexaqueue_cli.main:app"

[project.optional-dependencies]
dotenv = [
    "hexaqueue-core[dotenv]",
]
gcp = [
    "hexaqueue-server[gcp]",
]
github = [
    "hexaqueue-server[github]",
]
oci = [
    "hexaqueue-core[oci]",
    "hexaqueue-server[oci]",
]
oracle = [
    "hexaqueue-server[oracle]",
]
pytest = [
    "pytest-hexaqueue",
]
sentry = [
    "hexaqueue-worker[sentry]",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexaqueue-cli = { workspace = true }
hexaqueue-collateral = { workspace = true }
hexaqueue-core = { workspace = true }
hexaqueue-dashboard = { workspace = true }
hexaqueue-github-runner = { workspace = true }
hexaqueue-gitlab-runner = { workspace = true }
hexaqueue-kueue = { workspace = true }
hexaqueue-monitor = { workspace = true }
hexaqueue-scanner = { workspace = true }
hexaqueue-server = { workspace = true }
hexaqueue-worker = { workspace = true }
hexaqueue-workflow = { workspace = true }
pytest-hexaqueue = { workspace = true }
