[project]
name = "pytest-hexaqueue"
version = "0.8.1"
description = "pytest-hexaqueue - Distributed Test Slicing, Remote Execution, and Multi-CSP Free-Tier Runner Plugin"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hexaqueue-collateral",
    "hexaqueue-core",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
]

[project.entry-points.pytest11]
hexaqueue = "pytest_hexaqueue.infra.plugin"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
hexaqueue-collateral = { workspace = true }
hexaqueue-core = { workspace = true }
