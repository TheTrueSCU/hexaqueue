[project]
name = "hexaqueue-worker"
version = "0.1.0"
description = "Hexaqueue Worker - Lightweight Compute Node Execution Daemon"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hexaqueue-core",
    "hexastack-auth>=0.3.0",
    "hexastack-core>=0.3.0",
    "hexastack-grpc>=0.3.0",
    "hexastack-logging>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hexaqueue-core = { workspace = true }
