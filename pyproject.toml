[project]
name = "hexaqueue-workspace"
version = "0.0.0"
description = "Hexaqueue - Cloud-Agnostic HPC Batch Scheduler and Distributed Job Orchestrator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hexaqueue",
]

[project.scripts]
alphabetizer = "hexastack_tools.commands.rope:alphabetize_main"
check-all-statements = "hexastack_tools.commands.all_statements:check_main"
check-extras-parity = "hexastack_tools.commands.extras_parity:main"
check-test-parity = "hexastack_tools.commands.test_parity:main"
codeql-scan = "hexastack_tools.commands.codeql_scan:main"
deps-audit = "hexastack_tools.commands.deps_audit:main"
deptry-run = "hexastack_tools.commands.deptry:main"
fix-all-statements = "hexastack_tools.commands.all_statements:fix_main"
generate-usage-docs = "hexastack_tools.commands.usage_docs:main"
gh-checks = "hexastack_tools.commands.checks:main"
gh-code-scanning = "hexastack_tools.commands.code_scanning:main"
gh-pr-examine = "hexastack_tools.commands.pr_examine:main"
gh-security = "hexastack_tools.commands.security:main"
import-linter-generate = "hexastack_tools.commands.import_linter:generate_main"
import-linter-run = "hexastack_tools.commands.import_linter:run_main"
inline-snapshot-update = "hexastack_tools.commands.inline_snapshot:main"
mutmut-inspect = "hexastack_tools.commands.mutmut:inspect_main"
mutmut-run = "hexastack_tools.commands.mutmut:run_main"
pydeps-generate = "hexastack_tools.commands.pydeps:generate_main"
pypi-build = "hexastack_tools.commands.pypi:build_main"
pypi-check = "hexastack_tools.commands.pypi:check_main"
pypi-publish = "hexastack_tools.commands.pypi:publish_main"
pytest-archon-generate = "hexastack_tools.commands.pytest_runner:archon_generate_main"
pytest-boundary-audit = "hexastack_tools.commands.coverage:boundary_audit_main"
pytest-impact = "hexastack_tools.commands.coverage:impact_main"
pytest-redundancy-audit = "hexastack_tools.commands.coverage:redundancy_audit_main"
pytest-run = "hexastack_tools.commands.pytest_runner:run_main"
rope-alphabetizer = "hexastack_tools.commands.rope:alphabetize_main"
rope-run = "hexastack_tools.commands.rope:run_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/hexaqueue/src"]

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
hexaqueue = { workspace = true }
hexaqueue-cli = { workspace = true }
hexaqueue-collateral = { workspace = true }
hexaqueue-core = { workspace = true }
hexaqueue-dashboard = { workspace = true }
hexaqueue-github-runner = { workspace = true }
hexaqueue-gitlab-runner = { workspace = true }
hexaqueue-kueue = { workspace = true }
hexaqueue-monitor = { workspace = true }
hexaqueue-scanner = { workspace = true }
hexaqueue-server = { workspace = true }
hexaqueue-worker = { workspace = true }
hexaqueue-workflow = { workspace = true }

[dependency-groups]
dev = [
    "complexipy>=7.0.0",
    "deptry>=0.23.0",
    "detect-secrets>=1.5.0",
    "faker>=33.0.0",
    "hexastack-tools>=0.3.4",
    "hypothesis>=6.120.0",
    "import-linter>=2.13",
    "inline-snapshot>=0.35.0",
    "libcst>=1.0.0",
    "mutmut<4",
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "pydeps>=3.0.0",
    "pytest>=8.3.0",
    "pytest-archon>=0.0.7",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "rope>=1.14.0",
    "ruff>=0.9.0",
    "ty>=0.0.75",
    "vulture>=2.14",
    "zensical>=0.0.57",
]

[tool.coverage.run]
branch = false
source = ["packages/*/src"]
omit = [
    "*/__pycache__/*",
    "*/testing/*",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
    "return NotImplemented",
]

[tool.inline-snapshot]
format-command = "uv run ruff format --stdin-filename {filename} -"

[tool.pytest.ini_options]
testpaths = ["packages"]
norecursedirs = ["examples", ".venv", "dist", "build"]
addopts = "-n auto --import-mode=importlib --cov=packages --cov-fail-under=90 --cov-report=term-missing:skip-covered"
markers = [
    "integration: mark a test as requiring external infrastructure",
    "slow: mark a test as slow-running",
]
asyncio_mode = "auto"

[tool.ruff.lint]
select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "LOG",  # flake8-logging
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "B008",   # Do not perform function call in argument defaults
    "D100",   # Missing docstring in public module
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package (__init__.py)
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "E501",   # Line too long
    "E731",   # Do not assign a lambda expression
    "S104",   # Possible binding to all interfaces
    "S106",   # Possible hardcoded password argument
    "S108",   # Probable insecure usage of temp directory
    "S110",   # try-except-pass detected
    "S603",   # Subprocess call with dynamic inputs
    "S607",   # Starting process with partial path
    "UP040",  # Type alias uses TypeAlias
    "TC001",  # Move application import into type-checking block
    "TC002",  # Move third-party import into type-checking block
    "TC003",  # Move standard library import into type-checking block
]

[tool.ruff.lint.per-file-ignores]
"**/hexaqueue_cli/**/*.py" = ["T201"]
"**/tests/**/*.py" = ["ARG", "D", "E501", "S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = [
    "hexaqueue",
    "hexaqueue_cli",
    "hexaqueue_collateral",
    "hexaqueue_core",
    "hexaqueue_dashboard",
    "hexaqueue_github_runner",
    "hexaqueue_gitlab_runner",
    "hexaqueue_kueue",
    "hexaqueue_monitor",
    "hexaqueue_scanner",
    "hexaqueue_server",
    "hexaqueue_worker",
    "hexaqueue_workflow",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
